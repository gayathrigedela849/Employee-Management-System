<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        {% if employee %}
            Edit Employee
        {% else %}
            Add Employee
        {% endif %}
    </title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <nav>

        <div class="logo">
            Employee Management System
        </div>

        <div class="nav-links">

            <a href="/">Home</a>

            <a href="/add_employee">
                Add Employee
            </a>

            <a href="/view_employee">
                View Employees
            </a>

            <a href="/search_employee">
                Search Employee
            </a>

        </div>

    </nav>


    <div class="form-container">

        <h1>

            {% if employee %}
                Edit Employee
            {% else %}
                Add Employee
            {% endif %}

        </h1>

        <form

            {% if employee %}
                action="/update/{{ employee['id'] }}"
            {% else %}
                action="/save_employee"
            {% endif %}

            method="POST" autocomplete="off">

            <div class="form-grid">


                <div class="form-group">

                    <label>
                        Employee ID
                    </label>

                    <input
                        type="text"
                        name="employee_id"
                        placeholder="EMP001"
                        value="{{ employee['employee_id'] if employee else '' }}"
                        required>

                </div>


                <div class="form-group">

                    <label>
                        Full Name
                    </label>

                    <input
                        type="text"
                        name="fullname"
                        placeholder="Enter full name"
                        value="{{ employee['fullname'] if employee else '' }}"
                        required>

                </div>


                <div class="form-group">

                    <label>
                        Date of Birth
                    </label>

                    <input
                        type="date"
                        name="dob"
                        value="{{ employee['dob'] if employee else '' }}"
                        required>

                </div>


                <div class="form-group">

                    <label>
                        Gender
                    </label>

                    <select name="gender" required>

                        <option value="">
                            Select Gender
                        </option>

                        <option value="Male"
                        {% if employee and employee['gender'] == 'Male' %}
                            selected
                        {% endif %}>
                            Male
                        </option>

                        <option value="Female"
                        {% if employee and employee['gender'] == 'Female' %}
                            selected
                        {% endif %}>
                            Female
                        </option>

                        <option value="Other"
                        {% if employee and employee['gender'] == 'Other' %}
                            selected
                        {% endif %}>
                            Other
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label>
                        Email
                    </label>

                    <input
                        type="email"
                        name="email"
                        placeholder="example@gmail.com"
                        value="{{ employee['email'] if employee else '' }}"
                        required>

                </div>

                <div class="form-group">

                    <label>
                          Phone Number
                     </label>

                     <input
                        type="tel"
                        name="phone"
                        placeholder="Enter 10 digit phone number"
                        value="{{ employee['phone'] if employee else '' }}"
                        maxlength="10"
                        minlength="10"
                        pattern="[0-9]{10}"
                        required>

                </div>


                <div class="form-group full">


                    <label>
                        Address
                    </label>

                    <textarea
                        name="address"
                        rows="3"
                        placeholder="Enter address"
                        required>{{ employee['address'] if employee else '' }}</textarea>

                </div>


                <div class="form-group">

                    <label>
                        Department
                    </label>

                    <select name="department" required>

                        <option value="">
                            Select Department
                        </option>

                        <option value="IT"
                        {% if employee and employee['department'] == 'IT' %}
                            selected
                        {% endif %}>
                            IT
                        </option>

                        <option value="HR"
                        {% if employee and employee['department'] == 'HR' %}
                            selected
                        {% endif %}>
                            HR
                        </option>

                        <option value="Finance"
                        {% if employee and employee['department'] == 'Finance' %}
                            selected
                        {% endif %}>
                            Finance
                        </option>

                        <option value="Marketing"
                        {% if employee and employee['department'] == 'Marketing' %}
                            selected
                        {% endif %}>
                            Marketing
                        </option>

                        <option value="Sales"
                        {% if employee and employee['department'] == 'Sales' %}
                            selected
                        {% endif %}>
                            Sales
                        </option>

                        <option value="Operations"
                        {% if employee and employee['department'] == 'Operations' %}
                            selected
                        {% endif %}>
                            Operations
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label>
                        Designation
                    </label>

                    <input
                        type="text"
                        name="designation"
                        placeholder="Software Developer"
                        value="{{ employee['designation'] if employee else '' }}"
                        required>

                </div>


                <div class="form-group">

                    <label>
                        Date of Joining
                    </label>

                    <input
                        type="date"
                        name="joining_date"
                        value="{{ employee['joining_date'] if employee else '' }}"
                        required>

                </div>


                <div class="form-group">

                    <label>
                        Salary
                    </label>

                    <input
                        type="number"
                        name="salary"
                        placeholder="Enter salary"
                        min="0"
                        value="{{ employee['salary'] if employee else '' }}"
                        required>

                </div>


                <div class="form-group">

                    <label>
                        Qualification
                    </label>

                    <input
                        type="text"
                        name="qualification"
                        placeholder="B.Tech / B.Sc / MBA"
                        value="{{ employee['qualification'] if employee else '' }}"
                        required>

                </div>


                <div class="form-group">

                    <label>
                        Experience
                    </label>

                    <select name="experience" required>

                        <option value="">
                            Select Experience
                        </option>

                        <option value="Fresher"
                        {% if employee and employee['experience'] == 'Fresher' %}
                            selected
                        {% endif %}>
                            Fresher
                        </option>

                        <option value="1 Year"
                        {% if employee and employee['experience'] == '1 Year' %}
                            selected
                        {% endif %}>
                            1 Year
                        </option>

                        <option value="2 Years"
                        {% if employee and employee['experience'] == '2 Years' %}
                            selected
                        {% endif %}>
                            2 Years
                        </option>

                        <option value="3 Years"
                        {% if employee and employee['experience'] == '3 Years' %}
                            selected
                        {% endif %}>
                            3 Years
                        </option>

                        <option value="4+ Years"
                        {% if employee and employee['experience'] == '4+ Years' %}
                            selected
                        {% endif %}>
                            4+ Years
                        </option>

                    </select>

                </div>


                <div class="form-group full">

                    <label>
                        Skills
                    </label>

                    <textarea
                        name="skills"
                        rows="3"
                        placeholder="Python, HTML, CSS, JavaScript..."
                        required>{{ employee['skills'] if employee else '' }}</textarea>

                </div>

            </div>


            <div class="button-group">

                <button type="submit"
                        class="add-btn">

                    {% if employee %}
                        Update Employee
                    {% else %}
                        Add Employee
                    {% endif %}

                </button>


                <button type="reset"
                        class="reset-btn">

                    Reset

                </button>

            </div>

        </form>

    </div>
    <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>

</html>
